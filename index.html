<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin:0;
    background:transparent;
    color:white;
    font-family:Arial,sans-serif;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    overflow:hidden;
}

#overlay {
    padding:8px;
    white-space:nowrap;
}

</style>

</head>


<body>

<div id="overlay">
📍 Getting location...
</div>


<script>

let lastLat = null;
let lastLon = null;
let distance = 0;


/* Calculate distance walked */

function distanceBetween(lat1, lon1, lat2, lon2){

    let R = 6371000;

    let dLat = (lat2-lat1) * Math.PI/180;
    let dLon = (lon2-lon1) * Math.PI/180;

    let a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

    return R * 2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

}


/* Find clean neighborhood */

function getNeighborhood(address){

    let fields = [

        address.neighbourhood,
        address.quarter,
        address.suburb,
        address.city_district,
        address.borough

    ];


    let blocked = [

        "community board",
        "community",
        "cb ",
        "district",
        "ward",
        "administrative",
        "county"

    ];


    for(let item of fields){

        if(!item) continue;


        let value =
        item.toString();


        let lower =
        value.toLowerCase();


        let bad =
        blocked.some(word =>
        lower.includes(word)
        );


        if(!bad){

            return value;

        }

    }


    return "";

}



/* GPS update */

function updateLocation(position){

    let lat =
    position.coords.latitude;

    let lon =
    position.coords.longitude;



    if(lastLat !== null){

        let moved =
        distanceBetween(
            lastLat,
            lastLon,
            lat,
            lon
        );


        // ignore GPS jumps
        if(moved < 100){

            distance += moved;

        }

    }


    lastLat = lat;
    lastLon = lon;



    let miles =
    (distance / 1609.34).toFixed(2);


    let km =
    (distance / 1000).toFixed(2);



    /* Reverse location lookup */

    fetch(

    "https://nominatim.openstreetmap.org/reverse?format=json&lat="
    +lat+
    "&lon="
    +lon+
    "&zoom=18"

    )


    .then(response=>response.json())


    .then(location=>{


        let address =
        location.address;


        let street =
        address.road || "";


        let neighborhood =
        getNeighborhood(address);


        let city =
        address.city ||
        address.town ||
        address.village ||
        "";



        /* Weather */

        fetch(

        "https://api.open-meteo.com/v1/forecast?latitude="
        +lat+
        "&longitude="
        +lon+
        "&current=temperature_2m"

        )


        .then(response=>response.json())


        .then(weather=>{


            let c =
            weather.current.temperature_2m;


            let f =
            Math.round(
                c * 9/5 + 32
            );



            document.getElementById("overlay").innerHTML =


            "📍 " +
            street +

            (neighborhood ?
            " • " + neighborhood :
            "") +

            (city ?
            " • " + city :
            "") +

            " | 🌡️ " +
            f +
            "°F/" +
            c +
            "°C" +

            " | 🚶 " +
            miles +
            " mi (" +
            km +
            " km) walked";


        });


    });


}



/* GPS error */

function locationError(){

    document.getElementById("overlay").innerHTML =
    "📍 Location unavailable";

}



/* Start tracking */

navigator.geolocation.watchPosition(

    updateLocation,

    locationError,

    {

        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000

    }

);


</script>


</body>

</html>
